<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LyricLab - Home Dashboard</title>
  <link href="https://fonts.googleapis.com/css2?family=Alex+Brush&family=Share+Tech+Mono&display=swap" rel="stylesheet">
  <style>
    /* Reset defaults */
    * { 
      box-sizing: border-box; 
      margin: 0; 
      padding: 0; 
    }
    
    body {
      font-family: 'Share Tech Mono', monospace;
      color: white;
      height: 100vh;
      overflow: hidden;
      /* 🌄 MUSIC BACKGROUND IMAGE: High quality record vinyl player setup */
      background-image: linear-gradient(rgba(0, 0, 0, 0.65), rgba(0, 0, 0, 0.65)), 
                        url("https://images.unsplash.com/photo-1603048588665-791ca8aea617?q=80&w=1600&auto=format&fit=crop");
      background-size: cover;
      background-position: center;
      background-size: cover;
      background-position: center;
    }

    /* 👤 USER ACCOUNT BAR AT THE TOP LEFT */
    .user-profile-bar {
      position: absolute;
      top: 20px;
      left: 30px;
      display: flex;
      align-items: center;
      gap: 12px;
      background: rgba(15, 23, 42, 0.6);
      padding: 8px 16px;
      border-radius: 30px;
      border: 1px solid rgba(255, 255, 255, 0.1);
    }
    .user-profile-bar img { 
      width: 40px; 
      height: 40px; 
      border-radius: 50%; 
      object-fit: cover; 
      border: 2px solid #c084fc; 
    }
    .user-profile-bar span { 
      font-weight: bold; 
      font-size: 1.1rem; 
      color: #f1f5f9; 
    }

    /* ⋮ THREE-DOT MENU SYSTEM AT THE TOP RIGHT */
    .menu-container {
      position: absolute;
      top: 20px;
      right: 30px;
      z-index: 2000;
    }
    
    /* The Three-Dot Button */
    .three-dots-btn {
      background: rgba(15, 23, 42, 0.8);
      color: #c084fc;
      border: 1px solid rgba(255, 255, 255, 0.2);
      font-size: 1.8rem;
      padding: 0px 15px;
      border-radius: 8px;
      cursor: pointer;
      transition: all 0.2s;
    }
    .three-dots-btn:hover {
      background: #a855f7;
      color: white;
      border-color: #c084fc;
    }

    /* The Dropdown Card (hidden by default) */
    .menu-dropdown {
      display: none;
      position: absolute;
      top: 50px;
      right: 0;
      background: rgba(15, 23, 42, 0.95);
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 12px;
      width: 200px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.5);
      overflow: hidden;
    }

    /* Dropdown links */
    .menu-dropdown a, .menu-dropdown button {
      display: block;
      width: 100%;
      padding: 14px 20px;
      color: #cbd5e1;
      text-decoration: none;
      text-align: left;
      font-family: 'Share Tech Mono', monospace;
      font-size: 1rem;
      background: none;
      border: none;
      cursor: pointer;
      border-bottom: 1px solid rgba(255, 255, 255, 0.05);
      transition: background 0.2s, color 0.2s;
    }

    /* Hover effects inside dropdown menu */
    .menu-dropdown a:hover, .menu-dropdown button:hover {
      background: rgba(168, 85, 247, 0.2);
      color: #c084fc;
    }

    /* Special Log Out hover colors */
    .menu-dropdown .logout-opt:hover {
      background: rgba(239, 68, 68, 0.2);
      color: #f87171;
    }

    /* CSS Class to toggle showing the menu */
    .show {
      display: block !important;
    }

    /* 🎯 CENTERED HUB CONTENT */
    .main-hub-wrapper {
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
    }
    .center-box { 
      text-align: center; 
      width: 100%; 
      max-width: 600px; 
      padding: 20px; 
    }
    
    /* BIG LETTERS TEXT FONT FOR TITLE */
    .title-heading {
      font-family: 'Alex Brush', cursive;
      font-size: 6rem;
      color: #c084fc;
      text-shadow: 0px 4px 20px rgba(192, 132, 252, 0.4);
      margin-bottom: 5px;
    }
    .quote-tag { 
      font-size: 1.2rem; 
      color: #cbd5e1; 
      margin-bottom: 35px; 
      letter-spacing: 2px; 
    }

    /* INPUT SEARCH BAR WRAPPER */
    .search-wrapper {
      display: flex;
      background: rgba(255, 255, 255, 0.95);
      border-radius: 30px;
      overflow: hidden;
      border: 2px solid #a855f7;
      box-shadow: 0 8px 25px rgba(0,0,0,0.3);
    }
    .search-wrapper input {
      flex: 1; 
      padding: 16px 22px; 
      border: none; 
      outline: none;
      font-family: 'Share Tech Mono', monospace; 
      font-size: 1.1rem; 
      color: #0f172a;
    }
    .search-wrapper button {
      background: #a855f7; 
      border: none; 
      padding: 0 25px; 
      cursor: pointer;
      font-size: 1.3rem; 
      transition: background 0.2s;
    }
    .search-wrapper button:hover { 
      background: #9333ea; 
    }
  </style>
</head>
<body>

  <div class="user-profile-bar">
    <img id="navPhoto" src="" alt="User Pic">
    <span id="navName">User</span>
  </div>

  <div class="menu-container">
    <button class="three-dots-btn" onclick="toggleMenuDropdown()">⋮</button>
    <div id="dropdownMenu" class="menu-dropdown">
      <a href="profile.html">👤 Profile</a>
      <a href="explore.html">🌐 Explore</a>
      <a href="published.html">🚀 Publish</a>
      <a href="drafts.html">💾 Save Draft</a>
      <button onclick="handleLogout()" class="logout-opt">🚪 Log Out</button>
    </div>
  </div>

  <div class="main-hub-wrapper">
    <div class="center-box">
      <h1 class="title-heading">LyricLab</h1>
      <p class="quote-tag">"Where words become music"</p>
      
      <div class="search-wrapper">
        <input type="text" id="searchInput" placeholder="Search song title...">
        <button onclick="executeSearch()">🔍</button>
      </div>
    </div>
  </div>

  <script>
    // Load local cache session parameters immediately upon execution
    window.onload = function() {
      document.getElementById("navName").innerText = localStorage.getItem("username") || "Composer";
      document.getElementById("navPhoto").src = localStorage.getItem("userPic") || "https://images.unsplash.com/photo-1535713875002-d1d0cf377fde?q=80&w=150&auto=format&fit=crop";
      
      // Close dropdown if user clicks anywhere else outside the menu container box
      window.onclick = function(event) {
        if (!event.target.matches('.three-dots-btn')) {
          const dropdown = document.getElementById("dropdownMenu");
          if (dropdown.classList.contains('show')) {
            dropdown.classList.remove('show');
          }
        }
      }
    };

    // Toggle showing and hiding the dropdown menu card
    function toggleMenuDropdown() {
      document.getElementById("dropdownMenu").classList.toggle("show");
    }

    // Handles transferring what was written into the search box down to editor workspace
    function executeSearch() {
      const query = document.getElementById("searchInput").value.trim();
      if (!query) {
        alert("Please enter a song title first!");
        return;
      }
      localStorage.setItem("currentSearchSong", query);
      window.location.href = "editor.html";
    }

    // INSTAGRAM REMEMBER-ME PROFILE REVOLUTION LOG OUT METHOD
    function handleLogout() {
      if (confirm("Are you sure you want to Log Out from this device?")) {
        localStorage.removeItem("username"); // Erases the automatic entry gate key
        localStorage.removeItem("password"); // Erases the password key
        localStorage.removeItem("userPic"); // Erases the profile picture key
        window.location.href = "index.html";  // Boots user back out to registration gate screen
      }
    }
  </script>
</body>
</html>
